---
layout: compress
---
<!DOCTYPE html>
<html lang="en">
<head>

    {% if site.analytics-google %}
        {% include analytics-google.html %}
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <meta name=author content="{{ site.title }}">

    {% seo %}

    {% include favicon.html %}

    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}{{ "/feed.xml" }}" />

    <script src="https://kit.fontawesome.com/d9b09040a7.js" crossorigin="anonymous"></script>

    <style>
    
    {% if site.dark-theme == "auto" %}
        {% capture scss_sheet %}
            {% include style.scss %}
            @media (prefers-color-scheme: dark) {
                {% include style-dark.scss %}
            }
        {% endcapture %}
    {% elsif site.dark-theme %}
        {% capture scss_sheet %}{% include style-dark.scss %}{% endcapture %}
    {% else %}
        {% capture scss_sheet %}{% include style.scss %}{% endcapture %}
    {% endif %}

    {{ scss_sheet | scssify }}
    </style>

</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <script>
    (function () {
        var p = location.pathname;
        if (p.length > 1 && p.charAt(p.length - 1) === '/') {
            history.replaceState(null, '', p.slice(0, -1) + location.search + location.hash);
        }
    })();
    </script>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div class="spotlight" aria-hidden="true"></div>
    <div id="main" class="wrapper-{% if site.width == "normal" %}normal{% elsif site.width == "large" %}large{% endif %}">
        {% if page.layout == "post" %}
            <div class="post">
        {% else %}
            {% if showHeader != true %}
                <div class="page {{ page.title | downcase }}">
            {% else %}
                <div class="{{ page.title | downcase }}">
            {% endif %}
        {% endif %}

            {{ content }}
            </div>
                </div>
            </div>
    </div>
    <script>
    (function () {
        if (!('IntersectionObserver' in window)) { return; }
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }
        var els = document.querySelectorAll('.reveal');
        if (!els.length) { return; }
        document.documentElement.classList.add('rvl');
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in');
                    io.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });
        els.forEach(function (el) { io.observe(el); });
    })();
    (function () {
        if (!window.matchMedia('(pointer: fine)').matches) { return; }
        var spot = document.querySelector('.spotlight');
        if (spot) {
            var pending = false;
            window.addEventListener('pointermove', function (event) {
                if (pending) { return; }
                pending = true;
                window.requestAnimationFrame(function () {
                    pending = false;
                    spot.style.setProperty('--spot-x', event.clientX + 'px');
                    spot.style.setProperty('--spot-y', event.clientY + 'px');
                });
            }, { passive: true });
        }
        document.querySelectorAll('.project-card, .carousel-slide').forEach(function (card) {
            card.addEventListener('pointermove', function (event) {
                var rect = card.getBoundingClientRect();
                card.style.setProperty('--mx', (event.clientX - rect.left) + 'px');
                card.style.setProperty('--my', (event.clientY - rect.top) + 'px');
            }, { passive: true });
        });
    })();
    (function () {
        var bar = document.querySelector('.scroll-progress');
        var topbar = document.querySelector('.topbar');
        var pending = false;
        function update() {
            if (bar) {
                var max = document.documentElement.scrollHeight - window.innerHeight;
                var ratio = max > 0 ? Math.min(1, window.scrollY / max) : 0;
                bar.style.transform = 'scaleX(' + ratio + ')';
            }
            if (topbar) {
                topbar.classList.toggle('is-scrolled', window.scrollY > 12);
            }
        }
        window.addEventListener('scroll', function () {
            if (pending) { return; }
            pending = true;
            window.requestAnimationFrame(function () {
                pending = false;
                update();
            });
        }, { passive: true });
        update();
    })();
    </script>
    <script>
    (function () {
        var win = document.querySelector('.vp-window');
        if (!win) { return; }
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }
        if (window.matchMedia('(hover: none)').matches) { return; }
        var orbit = win.querySelector('.vp-orbit');
        if (!orbit) { return; }
        var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
        function tick() {
            cx += (tx - cx) * 0.08;
            cy += (ty - cy) * 0.08;
            orbit.style.transform = 'rotateX(' + (-10 + cy).toFixed(2) + 'deg) rotateY(' + cx.toFixed(2) + 'deg)';
            if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05) {
                raf = requestAnimationFrame(tick);
            } else {
                raf = null;
            }
        }
        function kick() { if (!raf) { raf = requestAnimationFrame(tick); } }
        win.addEventListener('pointermove', function (e) {
            var r = win.getBoundingClientRect();
            tx = ((e.clientX - r.left) / r.width - 0.5) * 30;
            ty = ((e.clientY - r.top) / r.height - 0.5) * -12;
            kick();
        });
        win.addEventListener('pointerleave', function () { tx = 0; ty = 0; kick(); });
    })();
    </script>
</body>
</html>
