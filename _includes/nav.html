<nav class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/"><span class="brand-full">{{ site.title }}</span><span class="brand-short">cw</span><span class="brand-dot">.</span></a>

        <ul class="topbar-links">
            {% if site.blog == true %}
                <li><a {% if page.title == "Blog" or page.layout == "post" %}class="active" {% endif %}href="/blog"><span class="n">01.</span>Blog</a></li>
            {% endif %}
            {% if site.projects == true %}
                <li><a {% if page.title == "Projects" %}class="active" {% endif %}href="/projects"><span class="n">02.</span>Projects</a></li>
            {% endif %}
            {% if site.about == true %}
                <li><a {% if page.title == "About" %}class="active" {% endif %}href="/about"><span class="n">03.</span>About</a></li>
            {% endif %}
            {% if site.resume == true %}
                <li><a class="resume" href="{% if site.resume-external %}{{ site.resume-url }}{% else %}/{{ site.resume-url }}{% endif %}" target="_blank" rel="noopener">Résumé<span class="dl">&darr;</span></a></li>
            {% endif %}
        </ul>
    </div>
</nav>
