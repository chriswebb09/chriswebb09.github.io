<div class="carousel" id="project-carousel" aria-roledescription="carousel" aria-label="Projects">
    <div class="carousel-viewport">
        <div class="carousel-track" data-carousel-track tabindex="0">
            {% for project in site.data.projects %}
                <article class="carousel-slide" aria-label="{{ forloop.index }} of {{ forloop.length }}">
                    <div class="carousel-media{% if project.portrait %} is-portrait{% endif %}"{% if project.accent %} style="background: linear-gradient(160deg, {{ project.accent }}2b 0%, {{ project.accent }}0a 55%, {{ project.accent }}22 100%)"{% endif %}>
                        <span class="carousel-count">0{{ forloop.index }} / 0{{ forloop.length }}</span>
                        <img src="{{ site.url }}/{{ project.image }}" alt="{{ project.title }} demo" loading="lazy">
                    </div>
                    <div class="carousel-body">
                        <div class="carousel-text">
                            <h3 class="carousel-title">{{ project.title }}</h3>
                            <p class="carousel-desc">{{ project.description }}</p>
                        </div>
                        <div class="carousel-meta">
                            <ul class="carousel-tags">
                                {% for tag in project.tags %}
                                    <li>{{ tag }}</li>
                                {% endfor %}
                            </ul>
                            <a class="carousel-cta" href="{{ project.github }}" target="_blank" rel="noopener">
                                <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                                View source
                            </a>
                        </div>
                    </div>
                </article>
            {% endfor %}
        </div>
        <button class="carousel-btn is-prev" type="button" aria-label="Previous project" data-carousel-prev>
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        </button>
        <button class="carousel-btn is-next" type="button" aria-label="Next project" data-carousel-next>
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </button>
    </div>
    <div class="carousel-dots" data-carousel-dots role="tablist" aria-label="Choose project"></div>
</div>

<script>
(function () {
    var root = document.getElementById('project-carousel');
    if (!root) { return; }

    var track = root.querySelector('[data-carousel-track]');
    var slides = Array.prototype.slice.call(track.children);
    var prevBtn = root.querySelector('[data-carousel-prev]');
    var nextBtn = root.querySelector('[data-carousel-next]');
    var dotsWrap = root.querySelector('[data-carousel-dots]');
    var current = 0;

    slides.forEach(function (slide, i) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('role', 'tab');
        dot.setAttribute('aria-label', 'Go to project ' + (i + 1));
        dot.addEventListener('click', function () { goTo(i); });
        dotsWrap.appendChild(dot);
    });

    var dots = Array.prototype.slice.call(dotsWrap.children);

    function slideStep() {
        var gap = parseFloat(window.getComputedStyle(track).columnGap) || 0;
        return slides[0].getBoundingClientRect().width + gap;
    }

    function goTo(i) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: i * slideStep(), behavior: 'smooth' });
    }

    function render(i) {
        if (i === current && dots[i].classList.contains('is-active')) { return; }
        current = i;
        dots.forEach(function (dot, j) {
            dot.classList.toggle('is-active', j === i);
            dot.setAttribute('aria-selected', j === i ? 'true' : 'false');
        });
        prevBtn.disabled = i === 0;
        nextBtn.disabled = i === slides.length - 1;
    }

    var ticking = false;
    track.addEventListener('scroll', function () {
        if (ticking) { return; }
        ticking = true;
        window.requestAnimationFrame(function () {
            ticking = false;
            render(Math.round(track.scrollLeft / slideStep()));
        });
    });

    prevBtn.addEventListener('click', function () { goTo(current - 1); });
    nextBtn.addEventListener('click', function () { goTo(current + 1); });

    track.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowLeft') { event.preventDefault(); goTo(current - 1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); goTo(current + 1); }
    });

    render(0);
})();
</script>
