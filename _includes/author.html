<section class="author-card">
    <img
        class="author-avatar"
        src="{% if site.authors[page.author].external-image == true %}{{ site.authors[page.author].picture }}{% else %}/{{ site.authors[page.author].picture }}{% endif %}"
        alt="{{ site.authors[page.author].name }}"
    />

    <div class="author-info">
        <span class="author-label">Written by</span>
        <h4 class="author-name">{{ site.authors[page.author].name }}</h4>
        <p class="author-bio">{{ site.authors[page.author].bio }}</p>

        <div class="author-links">
            {% if site.github %}
                <a href="https://github.com/{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
            {% endif %}
            {% if site.linkedin %}
                <a href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
            {% endif %}
            {% if site.email %}
                <a href="mailto:{{ site.email }}">Email</a>
            {% endif %}
        </div>
    </div>
</section>
