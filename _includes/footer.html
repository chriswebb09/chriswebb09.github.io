<footer class="footer-main">
    <div class="footer-cta">
        <span class="kicker">What's next</span>
        <h2 class="footer-title">Have an idea worth building?</h2>
        {% if site.email %}
            <a class="footer-mail" href="mailto:{{ site.email }}">{{ site.email }}<span class="arrow">&#8599;</span></a>
        {% endif %}
    </div>

    <div class="footer-bottom">
        <span class="copy">© {{ site.time | date: '%Y' }} {{ site.title }}</span>

        <span class="footer-links">
            <a href="/feed.xml" target="_blank">RSS</a>
            {% if site.github %}
                <a href="https://github.com/{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
            {% endif %}
            {% if site.linkedin %}
                <a href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
            {% endif %}
        </span>
    </div>
</footer>
